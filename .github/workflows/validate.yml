name: Validate Agent Skill

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate skill manifest and files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Agent Skill structure
        run: python3 scripts/validate_skill.py
      - name: Run validator regression tests
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
      - name: Set up Node.js for public installer smoke test
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify public skill discovery
        run: |
          npx --yes skills add VivatVibe/clean-code-engineer --list | tee skills-discovery.log
          grep -Fq "clean-code-engineer" skills-discovery.log
      - name: Verify public Codex installation
        run: |
          npx --yes skills add VivatVibe/clean-code-engineer --skill clean-code-engineer --agent codex --yes
          test -f .agents/skills/clean-code-engineer/SKILL.md
